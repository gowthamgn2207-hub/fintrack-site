<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinTrack - Personal Finance Manager</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f3f6fc;--card:#fff;--brand:#315fe8;--brand-l:#eaf0ff;--text:#192541;--muted:#6b7690;--line:#e4e9f2;--green:#13865e;--red:#d84d58;--amber:#e09a1a}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:22px;font-weight:700;color:var(--brand)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;cursor:pointer}
nav a.on{background:var(--brand-l);color:var(--brand)}
.who{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px}
main{max-width:1000px;margin:24px auto;padding:0 16px 60px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stat .l{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:23px;font-weight:700;margin-top:8px}
.green{color:var(--green)}.red{color:var(--red)}
label{display:block;font-size:13px;font-weight:600;margin-bottom:12px}
input,select{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #cfd8e8;border-radius:8px;font:inherit;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid #bcd0ff;border-color:var(--brand)}
button{font:inherit;font-weight:600;font-size:13px;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--brand);color:#fff}
button.sec{background:var(--brand-l);color:var(--brand)}
button.del{background:#fff0f0;color:#c33;padding:6px 10px;font-size:12px}
.full{width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.scroll{overflow-x:auto}
.notice{padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:10px;border:1px solid}
.n-info{background:#eef3ff;border-color:#dce6ff;color:#1f40a6}
.n-good{background:#e9f9f1;border-color:#c7efd9;color:#0d6b49}
.n-warn{background:#fff8e6;border-color:#fbe6a8;color:#8a5a00}
.n-danger{background:#fff0f0;border-color:#f7caca;color:#b3262f}
.n-tip{background:#f3efff;border-color:#ddd2ff;color:#5b3cc4}
.bar{height:9px;background:#e6ebf4;border-radius:9px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--brand)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
.auth{max-width:420px;margin:60px auto;padding:0 16px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;background:var(--brand-l);color:var(--brand)}
.tabs button.on{background:var(--brand);color:#fff}
.err{background:#fff0f0;color:#b3262f;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.cols{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.cols .c i{display:block;width:100%;max-width:46px;background:var(--brand);border-radius:6px 6px 0 0;min-height:2px}
.hrow{display:flex;justify-content:space-between;font-size:13px;margin-top:10px}
.warnbox{background:#fff8e6;border:1px solid #fbe6a8;color:#8a5a00;border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:14px}
@media(max-width:560px){h1{font-size:21px}}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- constants ----------
const CATS = ["Food","Travel","Shopping","Bills","Education","Entertainment","Healthcare","Housing","Salary","Other"];
const EXP = CATS.filter(c => c !== "Salary");
const PAY = ["Cash","UPI","Card","Bank Transfer","Other"];
const RULES = {
  Food:["food","lunch","dinner","breakfast","restaurant","swiggy","zomato","grocery","coffee"],
  Travel:["bus","train","metro","uber","ola","petrol","fuel","taxi","auto"],
  Shopping:["shopping","shirt","shoes","amazon","flipkart","dress"],
  Bills:["electricity","water bill","recharge","internet","mobile bill","wifi"],
  Education:["college","book","course","tuition","exam","stationery"],
  Entertainment:["movie","cinema","netflix","game","music"],
  Healthcare:["hospital","doctor","medicine","pharmacy","clinic"],
  Housing:["rent","house","maintenance"]
};
const WEIGHTS = [0.5, 0.3, 0.2];

// ---------- storage (falls back to memory if the browser blocks it) ----------
const mem = {};
let storageOK = true;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ storageOK = false; return k in mem ? mem[k] : d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ storageOK = false; mem[k] = v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};

// ---------- helpers ----------
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => "₹" + (Number(n) || 0).toLocaleString("en-IN", {minimumFractionDigits:2, maximumFractionDigits:2});
const pad = n => String(n).padStart(2, "0");
const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
const curMonth = () => today().slice(0,7);
function shift(ym, delta){ const [y,m] = ym.split("-").map(Number); const d = new Date(y, m-1+delta, 1); return d.getFullYear() + "-" + pad(d.getMonth()+1); }
function label(ym){ const [y,m] = ym.split("-").map(Number); return new Date(y, m-1, 1).toLocaleString("en-IN", {month:"short", year:"2-digit"}); }
const sum = a => a.reduce((s,t) => s + Number(t.amount), 0);

function categorize(desc, kind){
  const t = (desc || "").toLowerCase();
  if (kind === "income") return ["salary","payroll","wage"].some(w => t.includes(w)) ? "Salary" : "Other";
  for (const c in RULES) if (RULES[c].some(w => t.includes(w))) return c;
  return "Other";
}

async function hashPw(pw, salt){
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  } catch(e){
    let h = 5381; const s = salt + ":" + pw;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return "x" + h;
  }
}
const randomSalt = () => Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b => b.toString(16).padStart(2,"0")).join("");

// ---------- state ----------
let session = store.get("fintrack:session", null);
let D = { tx: [], budgets: [] };
let route = (location.hash || "#/dashboard").slice(2) || "dashboard";
let authTab = "login", authErr = "", flash = "";
let filters = { q:"", cat:"All", month:"" };

function loadData(){ D = store.get("fintrack:data:" + session, { tx: [], budgets: [] }); }
function saveData(){ store.set("fintrack:data:" + session, D); }
const users = () => store.get("fintrack:users", {});

// ---------- finance logic ----------
function expByMonth(){ const o = {}; D.tx.forEach(t => { if (t.kind === "expense"){ const m = t.date.slice(0,7); o[m] = (o[m]||0) + Number(t.amount); } }); return o; }
function expByCat(month){ const o = {}; D.tx.forEach(t => { if (t.kind === "expense" && (!month || t.date.slice(0,7) === month)) o[t.category] = (o[t.category]||0) + Number(t.amount); }); return o; }
function wavg(vals){ let n = 0, d = 0; vals.forEach((v,i) => { if (v != null){ n += v * WEIGHTS[i]; d += WEIGHTS[i]; } }); return d ? n / d : 0; }
function forecast(){
  const base = curMonth(), ms = [base, shift(base,-1), shift(base,-2)], bm = expByMonth();
  const tv = ms.map(m => bm[m] !== undefined ? bm[m] : null);
  const per = {};
  EXP.forEach(c => {
    const v = wavg(ms.map(m => bm[m] === undefined ? null : (expByCat(m)[c] || 0)));
    if (v > 0) per[c] = v;
  });
  return { total: Math.round(wavg(tv) * 100) / 100, per, next: shift(base, 1), used: tv.filter(v => v != null).length };
}
function insights(){
  const m = curMonth(), pm = shift(m,-1), now = expByCat(m), before = expByCat(pm), out = [];
  const cats = Object.keys(now);
  if (cats.length){ const top = cats.reduce((a,b) => now[a] >= now[b] ? a : b); out.push(["info", "Your highest-spending category this month is " + top + ": " + fmt(now[top]) + "."]); }
  D.budgets.filter(b => b.month === m).forEach(b => {
    const used = now[b.category] || 0, lim = Number(b.amount);
    if (lim <= 0) return;
    if (used >= lim) out.push(["danger", "You have reached or exceeded your " + b.category + " budget (" + fmt(used) + " of " + fmt(lim) + ")."]);
    else if (used >= lim * 0.8) out.push(["warn", "You have used at least 80% of your " + b.category + " budget (" + fmt(used) + " of " + fmt(lim) + ")."]);
  });
  cats.forEach(c => { const l = before[c] || 0; if (l > 0 && now[c] > l * 1.2) out.push(["warn", c + " spending is up " + Math.round((now[c]-l)/l*100) + "% compared with last month."]); });
  const mt = D.tx.filter(t => t.date.slice(0,7) === m);
  const inc = sum(mt.filter(t => t.kind === "income")), sp = sum(mt.filter(t => t.kind === "expense"));
  if (inc > 0){
    const r = Math.round((inc - sp) / inc * 100);
    out.push(r < 20 ? ["tip", "Your savings rate this month is " + r + "%. A common target is to save at least 20% of income."] : ["good", "Your savings rate this month is " + r + "%. Nice work staying above the common 20% target."]);
  }
  if (!out.length) out.push(["info", "Add transactions and budgets to receive spending insights."]);
  return out;
}

// ---------- views ----------
function vAuth(){
  return `<div class="auth"><div style="text-align:center;font-size:30px;font-weight:700;color:var(--brand);margin-bottom:16px">₹ FinTrack</div>
  <div class="card">
    <div class="tabs"><button class="${authTab==='login'?'on':''}" data-tab="login">Login</button><button class="${authTab==='register'?'on':''}" data-tab="register">Register</button></div>
    ${authErr ? `<div class="err">${esc(authErr)}</div>` : ""}
    <form id="authForm">
      ${authTab==='register' ? `<label>Name<input name="name" required></label>` : ""}
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Password${authTab==='register' ? " (minimum 8 characters)" : ""}<input name="password" type="password" required minlength="${authTab==='register'?8:1}" autocomplete="${authTab==='register'?'new-password':'current-password'}"></label>
      <button class="full">${authTab==='login' ? "Login" : "Create account"}</button>
    </form>
    <p class="muted" style="margin:14px 0 0">Accounts and data are stored privately in this browser on this device.</p>
  </div></div>`;
}

function shell(inner){
  const links = [["dashboard","Dashboard"],["transactions","Transactions"],["add","Add Entry"],["budgets","Budgets"],["forecast","Forecast"],["insights","AI Insights"]];
  const u = users()[session];
  return `<header><div class="brand">₹ FinTrack</div>
  <nav>${links.map(l => `<a data-go="${l[0]}" class="${route===l[0]?'on':''}">${l[1]}</a>`).join("")}</nav>
  <div class="who"><span>${esc(u ? u.name : session)}</span><button class="sec" id="logout">Logout</button></div></header>
  <main>${storageOK ? "" : `<div class="warnbox">Your browser is blocking local storage, so data will be lost when you close this tab.</div>`}${flash ? `<div class="notice n-good">${esc(flash)}</div>` : ""}${inner}</main>`;
}

function vDashboard(){
  const m = curMonth(), mt = D.tx.filter(t => t.date.slice(0,7) === m);
  const inc = sum(mt.filter(t => t.kind==="income")), exp = sum(mt.filter(t => t.kind==="expense"));
  const f = forecast(), bm = expByMonth(), cats = Object.entries(expByCat(m)).sort((a,b) => b[1]-a[1]);
  const series = Array.from({length:6}, (_,i) => { const k = shift(m, i-5); return [label(k), bm[k] || 0]; });
  const mx = Math.max(1, ...series.map(s => s[1]));
  const u = users()[session];
  return `<h1>Hello, ${esc(u ? u.name : "there")}!</h1><p class="muted">Your financial summary for ${m}.</p>
  <div class="grid g4" style="margin:16px 0">
    <div class="card stat"><div class="l">Monthly income</div><div class="v green">${fmt(inc)}</div></div>
    <div class="card stat"><div class="l">Monthly expenses</div><div class="v red">${fmt(exp)}</div></div>
    <div class="card stat"><div class="l">Remaining cash flow</div><div class="v">${fmt(inc-exp)}</div></div>
    <div class="card stat"><div class="l">Forecast: next month</div><div class="v">${fmt(f.total)}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>Expenses by category</h2>${cats.length ? cats.map(([c,a]) => `<div class="hrow"><span>${esc(c)}</span><b>${fmt(a)}</b></div><div class="bar"><i style="width:${Math.round(a/Math.max(exp,1)*100)}%"></i></div>`).join("") : `<div class="empty">No expenses recorded this month yet.</div>`}</div>
    <div class="card"><h2>Last 6 months</h2><div class="cols">${series.map(s => `<div class="c"><i style="height:${Math.round(s[1]/mx*100)}%" title="${fmt(s[1])}"></i><span style="margin-top:6px">${esc(s[0])}</span></div>`).join("")}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><h2>Quick actions</h2><div style="display:flex;gap:10px;flex-wrap:wrap"><button data-go="add">Add Transaction</button><button class="sec" data-go="budgets">Manage Budget</button><button class="sec" data-go="forecast">View Forecast</button></div></div>`;
}

function vTransactions(){
  const q = filters.q.trim().toLowerCase();
  const rows = D.tx.filter(t => (filters.cat === "All" || t.category === filters.cat) && (!filters.month || t.date.slice(0,7) === filters.month) && (!q || (t.description + " " + t.category + " " + t.payment).toLowerCase().includes(q)))
    .sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  return `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h1>Transactions</h1><button data-go="add">+ Add Transaction</button></div>
  <div class="card grid g4" style="margin:14px 0">
    <label style="margin:0">Search<input id="fq" placeholder="Description, category..." value="${esc(filters.q)}"></label>
    <label style="margin:0">Category<select id="fc"><option>All</option>${CATS.map(c => `<option ${filters.cat===c?'selected':''}>${c}</option>`).join("")}</select></label>
    <label style="margin:0">Month<input id="fm" type="month" value="${esc(filters.month)}"></label>
  </div>
  <div class="card scroll">${rows.length ? `<table><tr><th>Date</th><th>Type</th><th>Description</th><th>Category</th><th>Payment</th><th style="text-align:right">Amount</th><th></th></tr>
  ${rows.map(t => `<tr><td>${esc(t.date)}</td><td>${esc(t.kind)}</td><td>${esc(t.description)}</td><td>${esc(t.category)}</td><td>${esc(t.payment)}</td><td style="text-align:right;font-weight:700" class="${t.kind==='income'?'green':''}">${t.kind==='income'?'+':'-'}${fmt(t.amount)}</td><td><button class="del" data-del="${esc(t.id)}">Delete</button></td></tr>`).join("")}</table>` : `<div class="empty">${D.tx.length ? "No transactions match your filters." : "No transactions added yet."}</div>`}</div>`;
}

function vAdd(){
  return `<div style="max-width:560px;margin:auto"><div class="card"><h1 style="margin-bottom:14px">Add Transaction</h1>
  <form id="addForm">
    <label>Transaction type<select name="kind"><option value="expense">Expense</option><option value="income">Income</option></select></label>
    <label>Amount (₹)<input name="amount" type="number" min="0.01" step="0.01" required></label>
    <label>Description<input name="description" placeholder="e.g. Lunch at restaurant"></label>
    <label>Category<select name="category"><option>Auto-detect</option>${CATS.map(c => `<option>${c}</option>`).join("")}</select><span id="prev" class="muted"></span></label>
    <label>Payment method<select name="payment">${PAY.map(p => `<option>${p}</option>`).join("")}</select></label>
    <label>Date<input name="date" type="date" value="${today()}" required></label>
    <button class="full">Save Transaction</button>
  </form></div></div>`;
}

function vBudgets(){
  const m = curMonth(), spent = expByCat(m), rows = D.budgets.filter(b => b.month === m).sort((a,b) => a.category.localeCompare(b.category));
  return `<h1 style="margin-bottom:14px">Budget Management</h1><div class="grid g2">
  <div class="card"><h2>Set monthly budget</h2><form id="budForm">
    <label>Category<select name="category">${EXP.map(c => `<option>${c}</option>`).join("")}</select></label>
    <label>Budget amount (₹)<input name="amount" type="number" min="0" step="0.01" required></label>
    <button class="full">Save Budget</button></form></div>
  <div class="card"><h2>Budget progress - ${m}</h2>${rows.length ? rows.map(b => {
    const used = spent[b.category] || 0, lim = Number(b.amount), pct = lim ? Math.round(used/lim*100) : 0;
    const col = pct > 100 ? "var(--red)" : pct > 80 ? "var(--amber)" : "var(--brand)";
    return `<div style="margin-bottom:14px"><div class="hrow" style="margin:0"><b>${esc(b.category)}</b><span class="${pct>100?'red':'muted'}">${pct}%</span></div><div class="bar"><i style="width:${Math.min(100,pct)}%;background:${col}"></i></div><div class="muted">Spent ${fmt(used)} of ${fmt(lim)} - Remaining ${fmt(lim-used)}</div></div>`;
  }).join("") : `<div class="empty">No budgets set for this month.</div>`}</div></div>`;
}

function chartSvg(){
  const base = curMonth(), bm = expByMonth(), f = forecast();
  const pts = [];
  for (let i = 5; i >= 0; i--){ const m = shift(base,-i); pts.push({l:label(m), a: bm[m] !== undefined ? bm[m] : null}); }
  pts.push({l: label(f.next), a: null, f: f.total});
  const last = pts[5]; if (last.a != null) last.f = last.a;
  const vals = pts.flatMap(p => [p.a, p.f]).filter(v => v != null);
  const mx = Math.max(1, ...vals) * 1.15, W = 640, H = 230, L = 56, R = 16, T = 12, B = 34;
  const x = i => L + i * (W-L-R) / (pts.length-1), y = v => T + (H-T-B) * (1 - v/mx);
  let aPath = "", pen = false;
  pts.forEach((p,i) => { if (p.a == null){ pen = false; return; } aPath += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(p.a).toFixed(1); pen = true; });
  const fPts = pts.map((p,i) => p.f != null ? [x(i), y(p.f)] : null).filter(Boolean);
  const fPath = fPts.length > 1 ? "M" + fPts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L") : "";
  const grid = [0,.25,.5,.75,1].map(t => { const v = mx*t; return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e4e9f2" stroke-dasharray="3 3"/><text x="${L-8}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#6b7690">${Math.round(v)}</text>`; }).join("");
  const xl = pts.map((p,i) => `<text x="${x(i)}" y="${H-12}" font-size="10" text-anchor="middle" fill="#6b7690">${esc(p.l)}</text>`).join("");
  const dotsA = pts.map((p,i) => p.a != null ? `<circle cx="${x(i)}" cy="${y(p.a)}" r="3.5" fill="#315fe8"/>` : "").join("");
  const dotsF = pts.map((p,i) => p.f != null && i === 6 ? `<circle cx="${x(i)}" cy="${y(p.f)}" r="4.5" fill="#e09a1a"/>` : "").join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${xl}<path d="${aPath}" fill="none" stroke="#315fe8" stroke-width="2.5"/><path d="${fPath}" fill="none" stroke="#e09a1a" stroke-width="2.5" stroke-dasharray="6 4"/>${dotsA}${dotsF}</svg>
  <div class="muted"><span style="color:#315fe8">&#9632;</span> Actual &nbsp; <span style="color:#e09a1a">&#9632;</span> Forecast (dashed)</div>`;
}

function vForecast(){
  const f = forecast(), cats = Object.entries(f.per).sort((a,b) => b[1]-a[1]);
  return `<h1>Expense Forecast</h1><p class="muted">Estimate for ${label(f.next)}</p>
  <div class="grid g2" style="margin:14px 0"><div class="card stat"><div class="l">Predicted total expense</div><div class="v">${fmt(f.total)}</div></div><div class="card stat"><div class="l">Months of data used</div><div class="v">${f.used} of 3</div></div></div>
  <div class="card"><h2>Actual vs forecast</h2>${f.used ? chartSvg() : `<div class="empty">Add expenses to build a forecast.</div>`}</div>
  <div class="card" style="margin-top:14px"><h2>Predicted by category</h2>${cats.length ? `<table>${cats.map(([c,v]) => `<tr><td>${esc(c)}</td><td style="text-align:right;font-weight:700">${fmt(v)}</td></tr>`).join("")}</table>` : `<div class="empty">No category forecast yet.</div>`}</div>
  <p class="muted" style="margin-top:12px">Method: weighted moving average of the last 3 months (weights 50% / 30% / 20%, most recent first). A baseline estimate for an academic prototype, not a guaranteed prediction.</p>`;
}

function vInsights(){
  return `<h1>AI Insights</h1><p class="muted" style="margin-bottom:14px">Spending observations for this month.</p>${insights().map(i => `<div class="notice n-${i[0]}">${esc(i[1])}</div>`).join("")}
  <p class="muted">These are rule-based observations from your own data, not professional financial advice.</p>`;
}

// ---------- render + events ----------
function render(){
  const app = document.getElementById("app");
  if (!session){ app.innerHTML = vAuth(); bindAuth(); return; }
  const views = {dashboard:vDashboard, transactions:vTransactions, add:vAdd, budgets:vBudgets, forecast:vForecast, insights:vInsights};
  if (!views[route]) route = "dashboard";
  app.innerHTML = shell(views[route]());
  flash = "";
  bindApp();
}
function go(r){ route = r; location.hash = "#/" + r; render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", () => { const r = (location.hash || "").slice(2); if (r && r !== route && session){ route = r; render(); } });

function bindAuth(){
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { authTab = b.dataset.tab; authErr = ""; render(); });
  document.getElementById("authForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target), email = String(f.get("email")).trim().toLowerCase(), pw = String(f.get("password"));
    const all = users();
    if (authTab === "register"){
      const name = String(f.get("name")).trim();
      if (!name || pw.length < 8){ authErr = "Enter all details and use a password of at least 8 characters."; return render(); }
      if (all[email]){ authErr = "This email is already registered."; return render(); }
      const salt = randomSalt();
      all[email] = { name, salt, hash: await hashPw(pw, salt) };
      store.set("fintrack:users", all);
    } else {
      const u = all[email];
      if (!u || u.hash !== await hashPw(pw, u.salt)){ authErr = "Incorrect email or password."; return render(); }
    }
    session = email; store.set("fintrack:session", email); authErr = ""; loadData(); go("dashboard");
  };
}

function bindApp(){
  document.querySelectorAll("[data-go]").forEach(a => a.onclick = () => go(a.dataset.go));
  document.getElementById("logout").onclick = () => { session = null; store.del("fintrack:session"); authTab = "login"; render(); };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    if (!confirm("Delete this transaction?")) return;
    D.tx = D.tx.filter(t => t.id !== b.dataset.del); saveData(); flash = "Transaction deleted."; render();
  });
  const fq = document.getElementById("fq");
  if (fq){
    fq.oninput = () => { filters.q = fq.value; const pos = fq.selectionStart; render(); const n = document.getElementById("fq"); n.focus(); n.setSelectionRange(pos,pos); };
    document.getElementById("fc").onchange = e => { filters.cat = e.target.value; render(); };
    document.getElementById("fm").onchange = e => { filters.month = e.target.value; render(); };
  }
  const af = document.getElementById("addForm");
  if (af){
    const upd = () => { const k = af.kind.value, d = af.description.value; document.getElementById("prev").textContent = af.category.value === "Auto-detect" ? "Will be saved as: " + categorize(d, k) : ""; };
    ["kind","description","category"].forEach(n => af[n].addEventListener("input", upd)); upd();
    af.onsubmit = e => {
      e.preventDefault();
      const amount = parseFloat(af.amount.value);
      if (!(amount > 0)) return;
      const kind = af.kind.value, desc = af.description.value.trim();
      const category = af.category.value === "Auto-detect" ? categorize(desc, kind) : af.category.value;
      D.tx.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), kind, amount, category, description: desc, payment: af.payment.value, date: af.date.value });
      saveData(); flash = "Transaction saved successfully."; go("transactions");
    };
  }
  const bf = document.getElementById("budForm");
  if (bf) bf.onsubmit = e => {
    e.preventDefault();
    const amount = parseFloat(bf.amount.value), category = bf.category.value, month = curMonth();
    if (!(amount >= 0)) return;
    const ex = D.budgets.find(b => b.category === category && b.month === month);
    if (ex) ex.amount = amount; else D.budgets.push({ category, month, amount });
    saveData(); flash = "Budget saved successfully."; render();
  };
}

if (session && !users()[session]) { session = null; store.del("fintrack:session"); }
if (session) loadData();
render();
</script>
</body>
</html>
